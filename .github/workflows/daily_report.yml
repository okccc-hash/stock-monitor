name: Daily Market Monitor

on:
  schedule:
    # 国际标准时间 (UTC) 13:00 = 温哥华时间 早上 06:00
    - cron: '0 13 * * *'
  workflow_dispatch: # 允许手动点击触发

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install yfinance schedule requests

    - name: Run script instantly
      env:
        # 💡 绝招：直接在这里用纯英文逗号写你的股票，没有任何中文字符风险！
        WATCHLIST: "MP,UAMY,LAC,NVDA,TSM,AVGO,MRVL,AXTI"
      run: |
        python stock_monitor.py --now
